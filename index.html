<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome to GameOn</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900 text-white min-h-screen flex items-center justify-center">

    <!-- Welcome Section -->
    <div class="text-center p-8 bg-gray-800 rounded-3xl shadow-2xl max-w-lg w-full">
        <!-- Title -->
        <h1 class="text-5xl font-extrabold mb-2">
            Welcome to <span class="text-indigo-400">GameOn</span>
        </h1>
		<h1 class="text-6xl font-extrabold mb-6">
		            🎮
		        </h1>
        <!-- Subtitle -->
        <p class="mb-8 text-gray-300 text-lg">
            Discover and enjoy your favorite games, all in one place!
        </p>
        <!-- Action Button -->
        <a href="/games/list" 
           class="inline-block px-8 py-4 bg-indigo-500 hover:bg-indigo-600 rounded-xl text-white text-xl font-bold transition-all duration-300 shadow-lg transform hover:scale-105">
            Explore Games
        </a>
        <!-- Decorative Divider -->
        <div class="mt-8">
            <span class="text-gray-600 text-sm">
                Power your gaming passion with <span class="text-indigo-400 font-semibold">GameOn</span>.
            </span>
        </div>
    </div>

</body>
</html>
